name: Frontend build check

# El deploy lo hace DigitalOcean App Platform al recibir el push a main (el spec de la app está en el repo del backend: .do/app.yaml).
# Este workflow solo verifica que el proyecto compile, para enterarse antes de que falle el deploy.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build
        env:
          NUXT_PUBLIC_API_DOMAIN: https://api.flopidocentes.com
          NUXT_PUBLIC_API_BASE_URL: https://api.flopidocentes.com/api
